name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Azure Linux RPM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set script permissions
        run: chmod +x scripts/*.sh

      - name: Build RPM package
        run: ./scripts/build.sh

      - name: Run lifecycle tests
        run: ./scripts/test-lifecycle.sh

      - name: Upload built RPMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/*.rpm

  validate-scripts:
    name: Validate PowerShell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint and syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path scripts/*.ps1
          foreach ($script in $scripts) {
              $errors = @()
              [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Error "Syntax error in $($script.FullName): $($errors)"
                  exit 1
              }
              Write-Host "✓ $($script.Name) syntax is valid"
          }
