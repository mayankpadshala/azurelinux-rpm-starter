name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_script: ./scripts/build.sh
            test_script: ./scripts/test-lifecycle.sh
          - os: windows-latest
            build_script: .\scripts\build.ps1
            test_script: .\scripts\test-lifecycle.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set script permissions (Linux)
        if: runner.os == 'Linux'
        run: chmod +x scripts/*.sh

      - name: Build RPM package
        run: ${{ matrix.build_script }}

      - name: Run lifecycle tests
        run: ${{ matrix.test_script }}

      - name: Upload built RPMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.os }}
          path: dist/*.rpm
