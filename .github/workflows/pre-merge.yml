name: Pre-Merge Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pre-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lifecycle:
    name: RPM Lifecycle Tests (Azure Linux 3.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set script permissions
        run: chmod +x scripts/*.sh

      - name: Run lifecycle tests
        run: ./scripts/test-lifecycle.sh

  validate-scripts:
    name: Validate PowerShell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint and syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path scripts/*.ps1
          foreach ($script in $scripts) {
              $errors = @()
              [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Error "Syntax error in $($script.FullName): $($errors)"
                  exit 1
              }
              Write-Host "✓ $($script.Name) syntax is valid"
          }
