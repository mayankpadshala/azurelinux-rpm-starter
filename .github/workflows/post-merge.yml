name: Post-Merge Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force GitHub Release creation even if VERSION file was not changed in this push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set script permissions
        run: chmod +x scripts/*.sh

      - name: Extract package version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building package version: ${VERSION}"

      - name: Check if VERSION was updated
        id: check_version
        run: |
          BEFORE="${{ github.event.before }}"
          NEW_VERSION="${{ env.PACKAGE_VERSION }}"
          FORCE_RELEASE="${{ inputs.force_release }}"

          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "Force release requested via manual dispatch."
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            OLD_VERSION=$(git show "${BEFORE}:VERSION" 2>/dev/null | tr -d '[:space:]' || echo "")
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]' || echo "")
          else
            OLD_VERSION=""
          fi

          echo "Previous version: '${OLD_VERSION}'"
          echo "Current version:  '${NEW_VERSION}'"

          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "✓ VERSION was updated from ${OLD_VERSION} to ${NEW_VERSION} in this merge."
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ VERSION was not updated in this merge. Artifact will be saved, but GitHub Release will be skipped."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build RPM package
        run: ./scripts/build.sh "${{ env.PACKAGE_VERSION }}"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload built RPMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurelinux-rpm-v${{ env.PACKAGE_VERSION }}
          path: dist/*
          retention-days: 90

      - name: Publish to GitHub Release
        if: steps.check_version.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          TITLE="Release ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping release creation."
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "${TITLE}" \
              --generate-notes
          fi
