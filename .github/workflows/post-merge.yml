name: Post-Merge Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force GitHub Release creation even if VERSION file was not changed in this push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set script permissions
        run: chmod +x scripts/*.sh

      - name: Read VERSION file and check for version update
        id: version_check
        run: |
          # 1. Read current version directly from the VERSION file in the repo root
          VERSION_FILE="./VERSION"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "ERROR: File $VERSION_FILE does not exist!" >&2
            exit 1
          fi

          CURRENT_VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          echo "Current package version from $VERSION_FILE: '${CURRENT_VERSION}'"
          echo "PACKAGE_VERSION=${CURRENT_VERSION}" >> "$GITHUB_ENV"
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          # 2. Check for manual force-release input
          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "Manual force_release flag is set. Proceeding with release."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Determine the base commit on main before this merge
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BEFORE"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_COMMIT="HEAD~1"
          else
            BASE_COMMIT=""
          fi

          # 4. Check if the VERSION file changed in git between base commit and HEAD
          if [ -n "$BASE_COMMIT" ]; then
            PREVIOUS_VERSION=$(git show "${BASE_COMMIT}:VERSION" 2>/dev/null | tr -d '[:space:]' || echo "")
            HAS_VERSION_DIFF=$(git diff --name-only "$BASE_COMMIT" HEAD -- VERSION)
          else
            PREVIOUS_VERSION=""
            HAS_VERSION_DIFF=""
          fi

          echo "Base commit:               ${BASE_COMMIT:-none}"
          echo "Previous version in git:   '${PREVIOUS_VERSION}'"
          echo "Current version in $VERSION_FILE: '${CURRENT_VERSION}'"

          if [ -n "$HAS_VERSION_DIFF" ] && [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]; then
            echo "✓ The $VERSION_FILE file was modified in this merge (${PREVIOUS_VERSION} -> ${CURRENT_VERSION})."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ The $VERSION_FILE file was NOT modified in this merge."
            echo "  A workflow artifact will be created, but no GitHub Release will be published."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build RPM package
        run: ./scripts/build.sh "${{ steps.version_check.outputs.version }}"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload built RPMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurelinux-rpm-v${{ steps.version_check.outputs.version }}
          path: dist/*
          retention-days: 90

      - name: Publish to GitHub Release
        if: steps.version_check.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          TITLE="Release ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping release creation."
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "${TITLE}" \
              --generate-notes
          fi
